<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘 하늘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 구성: 상단은 현재 하늘 상태에 따라 색이 바뀌는 띠, 아래는 시간별·주간·생활 지표 순서 */
:root {
  --bg: #edf1f4; --panel: #ffffff; --ink: #18232e; --ink-2: #4d5c6a; --ink-3: #6d7b88;
  --line: #d9e0e6; --accent: #1a6c9e; --accent-soft: #1a6c9e22; --rain: #1668a8; --track: #e2e8ed;
  --good: #1f77c9; --fair: #2a9a55; --poor: #e08a1c; --bad: #d23c3c;
  --display: "Do Hyeon", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --on-sky: #ffffff; --on-sky-2: #ffffffd9; --sky-field: #ffffff24; --sky-field-line: #ffffff55;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10161d; --panel: #19222c; --ink: #e8eef3; --ink-2: #aab7c3; --ink-3: #8b99a6;
  --line: #2b3743; --accent: #6bb8e6; --accent-soft: #6bb8e62b; --rain: #7cc0ee; --track: #2b3743;
  --good: #5aa9ee; --fair: #4cc27b; --poor: #efa544; --bad: #ee6a6a; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #10161d; --panel: #19222c; --ink: #e8eef3; --ink-2: #aab7c3; --ink-3: #8b99a6;
  --line: #2b3743; --accent: #6bb8e6; --accent-soft: #6bb8e62b; --rain: #7cc0ee; --track: #2b3743;
  --good: #5aa9ee; --fair: #4cc27b; --poor: #efa544; --bad: #ee6a6a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--body); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hero :focus-visible { outline-color: var(--on-sky); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.hero { color: var(--on-sky); background: linear-gradient(170deg, var(--sky-a), var(--sky-b)); transition: background .4s; --sky-a: #0d5a94; --sky-b: #1a7ab0; }
.hero[data-sky="clear"] { --sky-a: #0d5a94; --sky-b: #1a7ab0; }
.hero[data-sky="night"] { --sky-a: #111832; --sky-b: #2a2f5c; }
.hero[data-sky="cloud"] { --sky-a: #3d4b59; --sky-b: #5b6b7a; }
.hero[data-sky="rain"]  { --sky-a: #22313f; --sky-b: #3c566e; }
.hero[data-sky="snow"]  { --sky-a: #47627c; --sky-b: #607f9b; }
.hero .wrap { padding-block: 16px 28px; display: grid; gap: 24px; }

.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { position: relative; flex: 1 1 220px; max-width: 360px; }
.search input { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--sky-field-line); background: var(--sky-field); color: var(--on-sky); }
.search input::placeholder { color: var(--on-sky-2); }
.suggest { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0; margin: 0; padding: 4px; list-style: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px #0003; max-height: 300px; overflow-y: auto; }
.suggest button { display: block; width: 100%; padding: 8px 10px; text-align: left; background: none; border: 0; border-radius: 6px; cursor: pointer; }
.suggest button:hover, .suggest button:focus-visible { background: var(--accent-soft); }
.suggest small { display: block; color: var(--ink-3); }
.suggest .note { padding: 8px 10px; color: var(--ink-2); }
.ghost { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--sky-field-line); background: transparent; color: var(--on-sky); cursor: pointer; white-space: nowrap; }
.ghost:hover { background: var(--sky-field); }
.ghost:disabled { opacity: .65; cursor: default; }

.now { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 16px 32px; align-items: end; }
.now h1 { margin: 0; font: 400 26px/1.2 var(--display); text-wrap: balance; }
.reading { display: flex; align-items: center; gap: 16px; margin-top: 4px; }
.temp { font: 400 clamp(84px, 16vw, 128px)/1 var(--display); font-variant-numeric: tabular-nums; }
.reading svg { width: 72px; height: 72px; flex: none; }
.cond { font-size: 20px; font-weight: 500; }
.sub { color: var(--on-sky-2); }
.brief { display: grid; gap: 8px; }
.brief p { margin: 0; }
.brief .lead { font-size: 17px; font-weight: 500; }

.layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; padding-block: 16px; align-items: start; }
.panel { background: var(--panel); border-radius: 10px; padding: 16px; min-width: 0; }
.panel h2 { margin: 0 0 12px; font: 400 19px/1.3 var(--display); }
.wide { grid-column: 1 / -1; }

#chart { position: relative; touch-action: pan-y; outline-offset: 4px; }
#chart svg text { fill: var(--ink-3); font: 400 11.5px var(--body); font-variant-numeric: tabular-nums; }
#chart svg text.title { fill: var(--ink-2); font-weight: 500; font-size: 12.5px; }
#chart svg text.val { fill: var(--ink); font-weight: 600; font-size: 13px; }
#chart .tip { position: absolute; top: 0; pointer-events: none; background: var(--ink); color: var(--panel); padding: 6px 10px; border-radius: 6px; font-size: 13px; line-height: 1.4; white-space: nowrap; z-index: 5; }
details { margin-top: 8px; color: var(--ink-2); }
summary { cursor: pointer; }
.tbl { overflow-x: auto; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; }
th, td { padding: 4px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 500; color: var(--ink-3); }

.days { list-style: none; margin: 0; padding: 0; display: grid; }
.days li { display: grid; grid-template-columns: 62px 24px 38px 32px minmax(30px, 1fr) 32px; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.days li:first-child { border-top: 0; }
.days svg { width: 24px; height: 24px; color: var(--ink-2); }
.days .d { font-weight: 500; line-height: 1.25; }
.days .d small { display: block; font-weight: 400; color: var(--ink-3); font-size: 12px; }
.days .sun { color: var(--bad); }
.days .sat { color: var(--good); }
.days .p { color: var(--rain); font-size: 13px; text-align: right; }
.days .p.dry { color: var(--ink-3); }
.days .lo { color: var(--ink-3); text-align: right; }
.days .hi { font-weight: 600; }
.range { position: relative; height: 6px; border-radius: 3px; background: var(--track); }
.range i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
.range b { position: absolute; top: -3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel); }

.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px 24px; }
.fact { min-width: 0; }
.fact h3 { margin: 0; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.fact .v { font: 400 30px/1.25 var(--display); font-variant-numeric: tabular-nums; }
.fact .v small { font: 400 13px var(--body); color: var(--ink-3); margin-left: 3px; }
.fact p { margin: 0; color: var(--ink-2); font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.arrow { width: 16px; height: 16px; flex: none; color: var(--ink-2); }

.err { display: grid; gap: 8px; justify-items: start; }
.err button { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--sky-field-line); background: var(--sky-field); color: var(--on-sky); cursor: pointer; }
footer { color: var(--ink-3); font-size: 13px; padding-block: 0 24px; }
footer a { color: inherit; }
footer p { margin: 0 0 4px; }

@media (max-width: 760px) {
  .now, .layout { grid-template-columns: minmax(0, 1fr); }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { .hero { transition: none; } }
</style>
</head>
<body>
<header class="hero" id="hero">
  <div class="wrap">
    <div class="bar">
      <form class="search" id="searchForm" autocomplete="off" role="search">
        <input id="q" type="search" placeholder="지역 검색 (예: 수지, 강릉, 가평)" aria-label="지역 검색">
        <ul class="suggest" id="suggest" hidden></ul>
      </form>
      <button class="ghost" id="locate" type="button">내 위치</button>
      <button class="ghost" id="refresh" type="button">새로고침</button>
    </div>
    <div id="now" aria-live="polite"><h1>날씨를 불러오고 있어요</h1></div>
  </div>
</header>

<main class="wrap layout" id="content" hidden>
  <section class="panel">
    <h2>앞으로 24시간</h2>
    <div id="chart" tabindex="0" aria-label="시간별 기온과 강수확률 그래프. 좌우 화살표로 시간을 옮길 수 있어요."></div>
    <details><summary>표로 보기</summary><div class="tbl" id="hourTable"></div></details>
  </section>
  <section class="panel">
    <h2>이번 주</h2>
    <ul class="days" id="days"></ul>
  </section>
  <section class="panel wide">
    <h2>오늘의 생활 정보</h2>
    <div class="facts" id="facts"></div>
  </section>
</main>

<footer class="wrap">
  <p id="stamp"></p>
  <p>날씨·대기질 예보: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (CC BY 4.0). 지역 검색: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>. 미세먼지는 측정소 관측값이 아니라 모델 추정치이며, 등급은 환경부 예보 기준으로 나눴어요.</p>
</footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const deg = n => String(Math.round(n)).replace('-', '−') + '°';

const CITIES = [
  ['용인', '경기도', 37.2411, 127.1776], ['용인 수지구', '경기도', 37.3220, 127.0975], ['용인 기흥구', '경기도', 37.2752, 127.1159], ['용인 처인구', '경기도', 37.2343, 127.2013],
  ['서울', '서울특별시', 37.5665, 126.9780], ['부산', '부산광역시', 35.1796, 129.0756], ['대구', '대구광역시', 35.8714, 128.6014], ['인천', '인천광역시', 37.4563, 126.7052],
  ['광주', '광주광역시', 35.1595, 126.8526], ['대전', '대전광역시', 36.3504, 127.3845], ['울산', '울산광역시', 35.5384, 129.3114], ['세종', '세종특별자치시', 36.4800, 127.2890],
  ['수원', '경기도', 37.2636, 127.0286], ['고양', '경기도', 37.6584, 126.8320], ['성남', '경기도', 37.4200, 127.1267], ['화성', '경기도', 37.1995, 126.8312],
  ['안산', '경기도', 37.3219, 126.8309], ['안양', '경기도', 37.3943, 126.9568], ['평택', '경기도', 36.9921, 127.1129], ['이천', '경기도', 37.2720, 127.4350],
  ['춘천', '강원특별자치도', 37.8813, 127.7298], ['원주', '강원특별자치도', 37.3422, 127.9202], ['강릉', '강원특별자치도', 37.7519, 128.8761], ['속초', '강원특별자치도', 38.2070, 128.5918],
  ['청주', '충청북도', 36.6424, 127.4890], ['천안', '충청남도', 36.8151, 127.1139], ['전주', '전북특별자치도', 35.8242, 127.1480],
  ['목포', '전라남도', 34.8118, 126.3922], ['여수', '전라남도', 34.7604, 127.6622], ['순천', '전라남도', 34.9507, 127.4872],
  ['포항', '경상북도', 36.0190, 129.3435], ['경주', '경상북도', 35.8562, 129.2247], ['안동', '경상북도', 36.5684, 128.7294],
  ['창원', '경상남도', 35.2281, 128.6811], ['진주', '경상남도', 35.1800, 128.1076], ['제주', '제주특별자치도', 33.4996, 126.5312], ['서귀포', '제주특별자치도', 33.2541, 126.5600]
].map(([name, region, lat, lon]) => ({ name, region, lat, lon }));

const WMO = { 0: '맑음', 1: '대체로 맑음', 2: '구름 조금', 3: '흐림', 45: '안개', 48: '짙은 안개', 51: '약한 이슬비', 53: '이슬비', 55: '짙은 이슬비', 56: '어는 이슬비', 57: '어는 이슬비', 61: '약한 비', 63: '비', 65: '강한 비', 66: '어는 비', 67: '강한 어는 비', 71: '약한 눈', 73: '눈', 75: '많은 눈', 77: '싸락눈', 80: '약한 소나기', 81: '소나기', 82: '강한 소나기', 85: '소낙눈', 86: '강한 소낙눈', 95: '뇌우', 96: '우박 동반 뇌우', 99: '강한 우박 동반 뇌우' };
const isSnow = c => (c >= 71 && c <= 77) || c === 85 || c === 86;
const isWet = c => c >= 51;
const skyOf = (c, day) => isSnow(c) ? 'snow' : isWet(c) ? 'rain' : (c === 3 || c === 45 || c === 48) ? 'cloud' : day ? 'clear' : 'night';

const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>';
const MOON = '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>';
const CLOUD = '<path d="M7 18a4 4 0 0 1-.6-7.95A5.5 5.5 0 0 1 17 9.5a4.25 4.25 0 0 1 0 8.5z"/>';
const UP = '<g transform="translate(0 -3)">' + CLOUD + '</g>';
function glyph(c, day) {
  if (c <= 1) return day ? SUN : MOON;
  if (c === 2) return (day ? '<g transform="translate(11.5 -.5) scale(.55)">' + SUN + '</g>' : '<g transform="translate(12 0) scale(.45)">' + MOON + '</g>') + '<g transform="translate(0 4) scale(.8)">' + CLOUD + '</g>';
  if (c === 3) return CLOUD;
  if (c === 45 || c === 48) return UP + '<path d="M5 18.5h14M8 21.5h8"/>';
  if (isSnow(c)) return UP + '<path d="M8 18.5v.01M12 20.5v.01M16 18.5v.01M8 22v.01M16 22v.01" stroke-width="2.4"/>';
  if (c >= 95) return UP + '<path d="M13 16l-3 3.5h3.5L11 23"/>';
  return UP + '<path d="M8 17.5l-1 3.5M12.5 17.5l-1 3.5M17 17.5l-1 3.5"/>';
}
const ICON_ATTR = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
const icon = (c, day = true) => `<svg ${ICON_ATTR}>${glyph(c, day)}</svg>`;

function hourLabel(t) {
  const h = +t.slice(11, 13);
  if (h === 0) return '자정';
  if (h === 12) return '정오';
  return h < 12 ? `오전 ${h}시` : `오후 ${h - 12}시`;
}
const clock = t => { const h = +t.slice(11, 13), m = t.slice(14, 16); return `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${m}`; };
const minutes = t => +t.slice(11, 13) * 60 + +t.slice(14, 16);
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
const dayOf = s => new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)).getDay();

const COMPASS = ['북', '북북동', '북동', '동북동', '동', '동남동', '남동', '남남동', '남', '남남서', '남서', '서남서', '서', '서북서', '북서', '북북서'];
const windWord = v => v < 4 ? '약한 바람' : v < 9 ? '약간 강한 바람' : v < 14 ? '강한 바람' : '매우 강한 바람';
const GRADES = { good: ['좋음', '--good'], fair: ['보통', '--fair'], poor: ['나쁨', '--poor'], bad: ['매우 나쁨', '--bad'] };
const pm10Grade = v => v <= 30 ? 'good' : v <= 80 ? 'fair' : v <= 150 ? 'poor' : 'bad';
const pm25Grade = v => v <= 15 ? 'good' : v <= 35 ? 'fair' : v <= 75 ? 'poor' : 'bad';
const uvWord = v => v < 3 ? '낮음' : v < 6 ? '보통' : v < 8 ? '높음' : v < 11 ? '매우 높음' : '위험';

function loadPlace() {
  try { const p = JSON.parse(localStorage.getItem('place')); if (p && isFinite(p.lat) && isFinite(p.lon)) return p; } catch (e) {}
  return CITIES[0];
}
function savePlace(p) { try { localStorage.setItem('place', JSON.stringify(p)); } catch (e) {} }

let place = loadPlace(), hours = [], latest = 0, cursor = null;

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function load() {
  const ticket = ++latest;
  const at = `latitude=${place.lat}&longitude=${place.lon}`;
  const wx = `https://api.open-meteo.com/v1/forecast?${at}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,is_day&hourly=temperature_2m,precipitation_probability,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max&past_days=1&forecast_days=7&timezone=auto&wind_speed_unit=ms`;
  const air = `https://air-quality-api.open-meteo.com/v1/air-quality?${at}&current=pm10,pm2_5&timezone=auto`;
  const [w, a] = await Promise.allSettled([getJSON(wx), getJSON(air)]);
  if (ticket !== latest) return;
  if (w.status !== 'fulfilled') return showError();
  render(w.value, a.status === 'fulfilled' ? a.value.current : null);
}

function showError() {
  if (!$('content').hidden) {
    $('stamp').textContent = '최신 날씨를 불러오지 못해 이전 정보를 보여주고 있어요. 인터넷 연결을 확인해 주세요.';
    return;
  }
  $('now').innerHTML = `<div class="err"><h1>${esc(place.name)} 날씨를 불러오지 못했어요</h1><p class="sub" style="margin:0">인터넷 연결을 확인한 뒤 다시 시도해 주세요.</p><button type="button" id="retry">다시 시도</button></div>`;
  $('retry').onclick = load;
}

function render(w, air) {
  const c = w.current, H = w.hourly, D = w.daily;
  const nowIdx = Math.max(0, H.time.indexOf(c.time.slice(0, 13) + ':00'));
  hours = H.time.slice(nowIdx, nowIdx + 24).map((t, i) => ({
    t, temp: H.temperature_2m[nowIdx + i], rain: H.precipitation_probability[nowIdx + i] ?? 0,
    code: H.weather_code[nowIdx + i], day: !!H.is_day[nowIdx + i]
  }));
  if (hours[0]) hours[0].temp = c.temperature_2m;
  const today = D.time.indexOf(c.time.slice(0, 10));
  const yesterday = nowIdx >= 24 ? H.temperature_2m[nowIdx - 24] : null;

  $('hero').dataset.sky = skyOf(c.weather_code, !!c.is_day);
  let compare = '';
  if (yesterday != null) {
    const d = Math.round(c.temperature_2m) - Math.round(yesterday);
    compare = d === 0 ? '어제 이 시간과 비슷해요' : `어제 이 시간보다 ${Math.abs(d)}° ${d > 0 ? '높아요' : '낮아요'}`;
  }
  $('now').innerHTML = `<div class="now">
    <div>
      <h1>${esc(place.name)}</h1>
      <div class="reading"><span class="temp">${deg(c.temperature_2m)}</span>${icon(c.weather_code, !!c.is_day)}</div>
      <div class="cond">${WMO[c.weather_code] ?? '날씨 정보 없음'}</div>
    </div>
    <div class="brief">
      <p class="lead">${esc(rainNote(c.weather_code))}</p>
      <p>체감 ${deg(c.apparent_temperature)} · 최고 ${deg(D.temperature_2m_max[today])} · 최저 ${deg(D.temperature_2m_min[today])}</p>
      ${compare ? `<p class="sub">${compare}</p>` : ''}
    </div>
  </div>`;

  cursor = null;
  drawChart();
  $('hourTable').innerHTML = `<table><thead><tr><th>시간</th><th>날씨</th><th>기온</th><th>강수확률</th></tr></thead><tbody>${hours.map(h => `<tr><td>${hourLabel(h.t)}</td><td>${WMO[h.code] ?? '-'}</td><td>${deg(h.temp)}</td><td>${h.rain}%</td></tr>`).join('')}</tbody></table>`;
  renderDays(D, today, c.temperature_2m);
  renderFacts(c, D, today, air);
  $('content').hidden = false;
  $('stamp').textContent = `${clock(c.time)} 기준 예보`;
}

function rainNote(code) {
  if (isWet(code)) {
    const word = isSnow(code) ? '눈' : '비';
    const stop = hours.find((h, i) => i > 0 && !isWet(h.code) && h.rain < 30);
    return stop ? `지금 ${word}가 오고 있어요. ${hourLabel(stop.t)}쯤 그칠 것 같아요.`.replace('눈가', '눈이') : `지금 ${word}가 오고 있어요. 하루 종일 이어질 수 있어요.`.replace('눈가', '눈이');
  }
  const next = hours.find(h => isWet(h.code) || h.rain >= 50);
  if (!next) return '앞으로 24시간 동안 비나 눈 소식이 없어요.';
  const word = isSnow(next.code) ? '눈' : '비';
  return `${hourLabel(next.t)}쯤 ${word} 소식이 있어요. 강수확률 ${next.rain}%예요.`;
}

function drawChart() {
  if (!hours.length) return;
  const box = $('chart');
  const W = Math.max(280, box.clientWidth), L = 32, R = 8, HT = 280;
  const T1 = 40, B1 = 158, T2 = 202, B2 = 248;
  const band = (W - L - R) / hours.length, X = i => L + band * (i + .5);
  const temps = hours.map(h => h.temp), lo0 = Math.min(...temps), hi0 = Math.max(...temps);
  const step = [1, 2, 5, 10].find(s => (Math.ceil(hi0 / s) - Math.floor(lo0 / s)) <= 4) ?? 20;
  const lo = Math.floor(lo0 / step) * step, hi = Math.max(Math.ceil(hi0 / step) * step, lo + step);
  const Y = v => B1 - (v - lo) / (hi - lo) * (B1 - T1);
  const Yr = v => B2 - v / 100 * (B2 - T2);
  const every = W >= 520 ? 3 : 6;
  let s = `<svg width="${W}" height="${HT}" viewBox="0 0 ${W} ${HT}" role="img" aria-label="24시간 기온과 강수확률">`;

  for (let v = lo; v <= hi; v += step) {
    s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${String(v).replace('-', '−')}°</text>`;
  }
  const pts = hours.map((h, i) => `${X(i).toFixed(1)},${Y(h.temp).toFixed(1)}`);
  s += `<polygon points="${X(0).toFixed(1)},${B1} ${pts.join(' ')} ${X(hours.length - 1).toFixed(1)},${B1}" fill="var(--accent-soft)"/>`;
  s += `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  s += `<circle cx="${X(0)}" cy="${Y(temps[0])}" r="4.5" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>`;

  const label = (i, dy) => {
    const x = Math.min(W - R - 14, Math.max(L + 14, X(i)));
    return `<text class="val" x="${x}" y="${Y(temps[i]) + dy}" text-anchor="middle">${deg(temps[i])}</text>`;
  };
  if (Math.round(hi0) !== Math.round(lo0)) {
    s += label(temps.indexOf(hi0), -9) + label(temps.indexOf(lo0), 19);
  } else {
    s += label(0, -9);
  }

  s += `<text class="title" x="${L}" y="${T2 - 10}">강수확률 (%)</text>`;
  [0, 50, 100].forEach(v => {
    s += `<line x1="${L}" x2="${W - R}" y1="${Yr(v)}" y2="${Yr(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${Yr(v) + 4}" text-anchor="end">${v}</text>`;
  });
  const bw = Math.min(10, Math.max(2, band - 2));
  hours.forEach((h, i) => {
    if (h.rain > 0) {
      const top = Yr(h.rain), rad = Math.min(3, bw / 2, B2 - top);
      s += `<path d="M${X(i) - bw / 2} ${B2}V${top + rad}Q${X(i) - bw / 2} ${top} ${X(i) - bw / 2 + rad} ${top}H${X(i) + bw / 2 - rad}Q${X(i) + bw / 2} ${top} ${X(i) + bw / 2} ${top + rad}V${B2}Z" fill="var(--rain)"/>`;
    }
  });

  hours.forEach((h, i) => {
    if (i % every) return;
    const x = Math.min(W - R - 18, Math.max(L + 18, X(i)));
    s += `<text x="${x}" y="${B2 + 20}" text-anchor="middle">${i === 0 ? '지금' : hourLabel(h.t)}</text>`;
    s += `<svg x="${X(i) - 11}" y="4" width="22" height="22" ${ICON_ATTR} color="var(--ink-2)">${glyph(h.code, h.day)}</svg>`;
  });

  if (cursor != null) {
    const x = X(cursor), h = hours[cursor];
    s += `<line x1="${x}" x2="${x}" y1="${T1 - 6}" y2="${B2}" stroke="var(--ink-3)" stroke-dasharray="3 3"/><circle cx="${x}" cy="${Y(h.temp)}" r="4.5" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>`;
  }
  s += '</svg>';
  box.innerHTML = s;

  if (cursor != null) {
    const h = hours[cursor], tip = document.createElement('div');
    tip.className = 'tip';
    tip.innerHTML = `<strong>${cursor === 0 ? '지금' : hourLabel(h.t)}</strong> ${deg(h.temp)} · ${WMO[h.code] ?? '-'}<br>강수확률 ${h.rain}%`;
    box.appendChild(tip);
    tip.style.left = Math.max(0, Math.min(W - tip.offsetWidth, X(cursor) - tip.offsetWidth / 2)) + 'px';
  }
  box.dataset.left = L;
  box.dataset.band = band;
}

function setCursor(i) {
  const next = i == null ? null : Math.max(0, Math.min(hours.length - 1, i));
  if (next !== cursor) { cursor = next; drawChart(); }
}

function renderDays(D, today, nowTemp) {
  const idx = D.time.map((_, i) => i).filter(i => i >= today);
  const lo = Math.min(...idx.map(i => D.temperature_2m_min[i])), hi = Math.max(...idx.map(i => D.temperature_2m_max[i]));
  const pct = v => (v - lo) / ((hi - lo) || 1) * 100;
  $('days').innerHTML = idx.map((i, n) => {
    const s = D.time[i], wd = dayOf(s), rain = D.precipitation_probability_max[i] ?? 0;
    const a = pct(D.temperature_2m_min[i]), b = pct(D.temperature_2m_max[i]);
    const cls = wd === 0 ? 'sun' : wd === 6 ? 'sat' : '';
    const name = n === 0 ? '오늘' : n === 1 ? '내일' : WEEK[wd] + '요일';
    return `<li>
      <div class="d ${cls}">${name}<small>${+s.slice(5, 7)}/${+s.slice(8, 10)}</small></div>
      <span title="${WMO[D.weather_code[i]] ?? ''}">${icon(D.weather_code[i])}</span>
      <span class="p ${rain < 30 ? 'dry' : ''}">${rain}%</span>
      <span class="lo">${deg(D.temperature_2m_min[i])}</span>
      <div class="range"><i style="left:${a}%;width:${Math.max(b - a, 2)}%"></i>${n === 0 ? `<b style="left:${Math.min(100, Math.max(0, pct(nowTemp)))}%" title="지금 기온"></b>` : ''}</div>
      <span class="hi">${deg(D.temperature_2m_max[i])}</span>
    </li>`;
  }).join('');
}

function gradeLine(key) {
  const [word, color] = GRADES[key];
  return `<p><span class="dot" style="background:var(${color})"></span>${word}</p>`;
}

function renderFacts(c, D, today, air) {
  const dirIdx = Math.round(c.wind_direction_10m / 22.5) % 16;
  const rise = D.sunrise[today], set = D.sunset[today], len = minutes(set) - minutes(rise);
  const uv = D.uv_index_max[today] ?? 0;
  const pm = (title, v, grade) => v == null
    ? `<div class="fact"><h3>${title}</h3><div class="v">-</div><p>지금은 정보를 받을 수 없어요</p></div>`
    : `<div class="fact"><h3>${title}</h3><div class="v">${Math.round(v)}<small>㎍/㎥</small></div>${gradeLine(grade(v))}</div>`;
  $('facts').innerHTML = [
    pm('미세먼지 (PM10)', air?.pm10, pm10Grade),
    pm('초미세먼지 (PM2.5)', air?.pm2_5, pm25Grade),
    `<div class="fact"><h3>오늘 자외선 최고</h3><div class="v">${uv.toFixed(1).replace(/\.0$/, '')}</div><p>${uvWord(uv)}</p></div>`,
    `<div class="fact"><h3>바람</h3><div class="v">${c.wind_speed_10m.toFixed(1)}<small>m/s</small></div><p><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${c.wind_direction_10m + 180}deg)" aria-hidden="true"><path d="M12 20V4M6 10l6-6 6 6"/></svg>${COMPASS[dirIdx]}풍 · ${windWord(c.wind_speed_10m)}</p></div>`,
    `<div class="fact"><h3>습도</h3><div class="v">${c.relative_humidity_2m}<small>%</small></div><p>${c.relative_humidity_2m < 35 ? '건조해요' : c.relative_humidity_2m > 75 ? '습해요' : '쾌적해요'}</p></div>`,
    `<div class="fact"><h3>일출 · 일몰</h3><div class="v">${rise.slice(11, 16)} · ${set.slice(11, 16)}</div><p>낮 길이 ${Math.floor(len / 60)}시간 ${len % 60}분</p></div>`
  ].join('');
}

function choose(p) {
  place = p;
  savePlace(p);
  $('q').value = '';
  closeSuggest();
  $('now').innerHTML = `<h1>${esc(p.name)} 날씨를 불러오고 있어요</h1>`;
  $('content').hidden = true;
  load();
}

let options = [];
function showSuggest(list, note) {
  options = list;
  $('suggest').innerHTML = list.map((p, i) => `<li><button type="button" data-i="${i}">${esc(p.name)}<small>${esc(p.region)}</small></button></li>`).join('') + (note ? `<li class="note">${esc(note)}</li>` : '');
  $('suggest').hidden = !list.length && !note;
}
function closeSuggest() { $('suggest').hidden = true; }

const localMatch = text => CITIES.filter(c => c.name.includes(text) || c.region.includes(text)).slice(0, 8);

$('q').addEventListener('input', e => {
  const text = e.target.value.trim();
  if (!text) return closeSuggest();
  showSuggest(localMatch(text), 'Enter를 누르면 다른 지역도 찾아봐요');
});
$('q').addEventListener('keydown', e => { if (e.key === 'Escape') closeSuggest(); });
$('suggest').addEventListener('click', e => {
  const b = e.target.closest('button[data-i]');
  if (b) choose(options[+b.dataset.i]);
});
document.addEventListener('click', e => { if (!$('searchForm').contains(e.target)) closeSuggest(); });

$('searchForm').addEventListener('submit', async e => {
  e.preventDefault();
  const text = $('q').value.trim();
  if (!text) return;
  const exact = CITIES.find(c => c.name === text);
  if (exact) return choose(exact);
  const local = localMatch(text);
  showSuggest(local, '찾는 중이에요');
  try {
    const found = await getJSON(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(text)}&format=jsonv2&limit=6&accept-language=ko&countrycodes=kr`);
    if ($('q').value.trim() !== text) return;
    const more = found.map(f => ({ name: f.name || f.display_name.split(',')[0], region: f.display_name.split(', ').slice(1).join(', '), lat: +f.lat, lon: +f.lon }));
    const all = [...local, ...more];
    showSuggest(all, all.length ? '' : `'${text}' 지역을 찾지 못했어요. 시·군·구 이름으로 다시 검색해 보세요.`);
  } catch (err) {
    showSuggest(local, '지역 검색에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.');
  }
});

$('locate').addEventListener('click', () => {
  const btn = $('locate');
  if (!navigator.geolocation) { btn.textContent = '위치 사용 불가'; return; }
  btn.disabled = true;
  btn.textContent = '위치 찾는 중';
  navigator.geolocation.getCurrentPosition(pos => {
    btn.disabled = false;
    btn.textContent = '내 위치';
    choose({ name: '내 위치', region: '', lat: +pos.coords.latitude.toFixed(4), lon: +pos.coords.longitude.toFixed(4) });
  }, () => {
    btn.disabled = false;
    btn.textContent = '위치 권한 필요';
    setTimeout(() => { btn.textContent = '내 위치'; }, 3000);
  }, { timeout: 10000 });
});
$('refresh').addEventListener('click', load);

const chart = $('chart');
chart.addEventListener('pointermove', e => {
  if (!hours.length) return;
  const r = chart.getBoundingClientRect();
  setCursor(Math.floor((e.clientX - r.left - +chart.dataset.left) / +chart.dataset.band));
});
chart.addEventListener('pointerleave', () => setCursor(null));
chart.addEventListener('blur', () => setCursor(null));
chart.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { e.preventDefault(); setCursor(cursor == null ? 0 : cursor + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); setCursor(cursor == null ? 0 : cursor - 1); }
  if (e.key === 'Escape') setCursor(null);
});
new ResizeObserver(() => drawChart()).observe(chart);

setInterval(() => { if (!document.hidden) load(); }, 15 * 60 * 1000);
load();
</script>
</body>
</html>
